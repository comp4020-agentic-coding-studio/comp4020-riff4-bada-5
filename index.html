<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavefield — a browser instrument</title>
    <meta
      name="description"
      content="Wavefield: a pentatonic pad played with pointer or keyboard in the browser, where pointer speed adds vibrato and the arrow keys shift brightness."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <div class="title-bar">
        <div>
          <h1>Wavefield</h1>
          <p id="recording-status" aria-live="polite">Play to record a path</p>
        </div>
        <div class="transport" aria-label="Recorded path controls">
          <button id="eraser" type="button" aria-pressed="false">Eraser</button>
          <button id="replay" type="button" disabled>Replay path</button>
          <button id="clear-recording" type="button" disabled>Clear</button>
        </div>
      </div>
      <div class="pad-wrap">
        <canvas
          id="pad"
          tabindex="0"
          aria-label="Play surface — draw to make sound. Hold Shift for a higher octave or Control for a lower octave. Use Eraser to edit recorded paths"
        ></canvas>
        <p data-testid="hint">
          Draw to play · Shift = high · Ctrl = low · Eraser edits paths
        </p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
