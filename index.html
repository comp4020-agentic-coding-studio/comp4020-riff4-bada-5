<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavefield — a browser instrument</title>
    <meta
      name="description"
      content="Wavefield: a pentatonic pad played with pointer or keyboard in the browser, where pointer speed adds vibrato and the arrow keys shift brightness."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Wavefield</h1>
      <canvas
        id="pad"
        tabindex="0"
        aria-label="Play surface — move your pointer across it, or press A to L, to make sound. Up and Down arrows brighten or darken the tone, even while keys are held"
      ></canvas>
      <p data-testid="hint">Click, tap, or press a key to play.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
