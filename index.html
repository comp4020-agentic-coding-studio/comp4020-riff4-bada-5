<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavefield — a browser instrument</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Wavefield</h1>
      <canvas
        id="pad"
        tabindex="0"
        aria-label="Play surface — move your pointer across it, or press A to L, to make sound"
      ></canvas>
      <p data-testid="hint">Click, tap, or press a key to play.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
